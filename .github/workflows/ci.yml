name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    defaults:
      run:
        working-directory: cortex
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cortex/package-lock.json
      - name: Install dependencies
        run: npm ci --verbose --no-audit --no-fund
      - name: Validate
        run: npm run check
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Browser journeys and accessibility
        run: npm run test:e2e
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report-${{ matrix.os }}
          path: |
            cortex/playwright-report/
            cortex/test-results/
          retention-days: 7
